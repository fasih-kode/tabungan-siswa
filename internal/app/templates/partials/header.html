{{define "header"}}
<header class="sticky top-0 z-30 flex w-full border-b border-gray-200 bg-white dark:border-gray-800 dark:bg-gray-900">
    <div class="flex w-full items-center justify-between px-4 py-3 lg:px-6">
        <div class="flex items-center gap-3">
            <details class="relative lg:hidden">
                <summary class="flex h-10 w-10 cursor-pointer list-none items-center justify-center rounded-lg border border-gray-200 text-gray-600 dark:border-gray-800 dark:text-gray-300">
                    <span class="sr-only">Buka menu</span>
                    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </summary>

                <div class="absolute left-0 top-full z-40 mt-2 w-72 rounded-2xl border border-gray-200 bg-white p-4 shadow-theme-lg dark:border-gray-800 dark:bg-gray-900">
                    {{template "navigation" .}}
                </div>
            </details>

            <div>
                <p class="text-sm font-medium text-gray-800 dark:text-white/90">{{.Title}}</p>
                <p class="text-xs text-gray-500 dark:text-gray-400">Tabungan Siswa</p>
            </div>
        </div>
    </div>
</header>
{{end}}
