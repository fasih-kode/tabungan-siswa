{{define "header"}}
<header class="sticky top-0 z-30 flex w-full border-b border-gray-200 bg-white dark:border-gray-800 dark:bg-gray-900">
    <div class="flex grow flex-col items-center justify-between lg:flex-row lg:px-6">
        <div class="flex w-full items-center justify-between gap-3 px-4 py-3 sm:gap-4 lg:px-0 lg:py-4">
            <div class="flex items-center gap-3">
                <details class="relative lg:hidden">
                    <summary class="flex h-10 w-10 cursor-pointer list-none items-center justify-center rounded-lg text-gray-500 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-800">
                        <span class="sr-only">Buka navigasi</span>
                        <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                    </summary>

                    <div class="absolute left-0 top-full z-40 mt-2 w-72 rounded-2xl border border-gray-200 bg-white p-4 shadow-theme-lg dark:border-gray-800 dark:bg-gray-900">
                        {{template "navigation" .}}
                    </div>
                </details>

                <a href="/protected" class="text-lg font-semibold text-gray-800 dark:text-white lg:hidden">
                    Tabungan Siswa
                </a>

                <div class="hidden lg:block">
                    <p class="text-sm font-medium text-gray-800 dark:text-white/90">{{.Title}}</p>
                    <p class="mt-0.5 text-xs text-gray-500 dark:text-gray-400">Tabungan Siswa</p>
                </div>
            </div>

            <div class="lg:hidden">
                <p class="text-sm font-medium text-gray-800 dark:text-white/90">{{.Title}}</p>
            </div>
        </div>
    </div>
</header>
{{end}}
