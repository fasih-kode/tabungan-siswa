{{define "page-content"}}
<div class="space-y-6">
    <div>
        <h1 class="text-2xl font-semibold text-gray-800 dark:text-white">
            {{.Heading}}
        </h1>
        <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
            {{.Description}}
        </p>
    </div>

    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-3">
        <div class="rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm dark:border-gray-800 dark:bg-gray-800">
            <div class="flex items-center justify-between">
                <p class="text-sm font-medium text-gray-500 dark:text-gray-400">
                    Siswa
                </p>
                <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-gray-100 text-gray-600 dark:bg-gray-700 dark:text-gray-300">
                    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.5a3 3 0 1 0-6 0m9-9a6 6 0 1 1-12 0 6 6 0 0 1 12 0Zm3 9a3 3 0 0 0-3-3m0-6a3 3 0 0 0-3-3"/>
                    </svg>
                </div>
            </div>

            <p class="mt-4 text-2xl font-semibold text-gray-800 dark:text-white">
                -
            </p>
        </div>

        <div class="rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm dark:border-gray-800 dark:bg-gray-800">
            <div class="flex items-center justify-between">
                <p class="text-sm font-medium text-gray-500 dark:text-gray-400">
                    Saldo
                </p>
                <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-gray-100 text-gray-600 dark:bg-gray-700 dark:text-gray-300">
                    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 7.5A2.5 2.5 0 0 1 5.5 5h13A2.5 2.5 0 0 1 21 7.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 16.5v-9Zm13 4.5h5"/>
                        <circle cx="16.5" cy="14" r="1"/>
                    </svg>
                </div>
            </div>

            <p class="mt-4 text-2xl font-semibold text-gray-800 dark:text-white">
                -
            </p>
        </div>

        <div class="rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm dark:border-gray-800 dark:bg-gray-800">
            <div class="flex items-center justify-between">
                <p class="text-sm font-medium text-gray-500 dark:text-gray-400">
                    Transaksi
                </p>
                <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-gray-100 text-gray-600 dark:bg-gray-700 dark:text-gray-300">
                    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M7 3v18m10-18v18M4 7h4m8 10h4M4 17h4m8-10h4"/>
                    </svg>
                </div>
            </div>

            <p class="mt-4 text-2xl font-semibold text-gray-800 dark:text-white">
                -
            </p>
        </div>
    </div>

    <div class="rounded-2xl border border-gray-200 bg-white shadow-theme-sm dark:border-gray-800 dark:bg-gray-800">
        <div class="border-b border-gray-200 px-5 py-4 dark:border-gray-800">
            <h2 class="text-base font-semibold text-gray-800 dark:text-white">
                Aktivitas Terbaru
            </h2>
        </div>

        <div class="px-5 py-12 text-center">
            <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-gray-100 text-gray-500 dark:bg-gray-700 dark:text-gray-400">
                <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6l4 2m5-2a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
                </svg>
            </div>

            <h3 class="mt-4 text-sm font-medium text-gray-800 dark:text-white">
                Belum ada aktivitas
            </h3>

            <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
                Aktivitas terbaru akan ditampilkan di sini.
            </p>
        </div>
    </div>
</div>
{{end}}
